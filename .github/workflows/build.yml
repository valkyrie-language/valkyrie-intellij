name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: valkyrie-intellij
    steps:
      - name: Fetch valkyrie-intellij
        uses: actions/checkout@v4
        with:
          path: valkyrie-intellij

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify monorepo
        run: ./gradlew ciVerify

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            valkyrie-intellij/projects/plugins/intellij-valkyrie/build/reports/tests
            valkyrie-intellij/projects/plugins/intellij-voml/build/reports/tests
            valkyrie-intellij/projects/plugins/intellij-vos/build/reports/tests
